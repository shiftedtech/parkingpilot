<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ParkPilot</title>
<meta name="description" content="Find nearby malls and carparks in Singapore & JB that allow motorcycle parking, with rate info.">
<link rel="icon" type="image/png" sizes="96x96" href="./assets/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="152x152" href="./assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ParkPilot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e7c66">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  img{max-width:100%}

  :root{
    --bg:#f3faf9; --surface:#ffffff; --surface-2:#e7f5f3;
    --text:#0a1420; --text-muted:#56727a; --border:#d7ece9;
    --accent:#0e7c66; --accent-strong:#0a5c4d; --accent-soft:#dff6f2;
    --ok:#178a6f; --ok-soft:#e1f5ef;
    --warn:#a9790a; --warn-soft:#fdf3d8;
    --full:#c0392b; --full-soft:#fbe2df;
    --shadow-sm:0 1px 2px rgba(10,20,32,.06);
    --shadow-md:0 10px 30px rgba(10,20,32,.10);
    --radius:12px; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a1420; --surface:#101e2e; --surface-2:#16283b;
      --text:#ffffff; --text-muted:#9fb3be; --border:rgba(255,255,255,.08);
      --accent:#2ec4b6; --accent-strong:#6be0d3; --accent-soft:rgba(46,196,182,.15);
      --ok:#2ec4b6; --ok-soft:rgba(46,196,182,.12);
      --warn:#ffe066; --warn-soft:rgba(255,224,102,.15);
      --full:#ff6b6b; --full-soft:rgba(192,57,43,.25);
      --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 10px 30px rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a1420; --surface:#101e2e; --surface-2:#16283b;
    --text:#ffffff; --text-muted:#9fb3be; --border:rgba(255,255,255,.08);
    --accent:#2ec4b6; --accent-strong:#6be0d3; --accent-soft:rgba(46,196,182,.15);
    --ok:#2ec4b6; --ok-soft:rgba(46,196,182,.12);
    --warn:#ffe066; --warn-soft:rgba(255,224,102,.15);
    --full:#ff6b6b; --full-soft:rgba(192,57,43,.25);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;}
  h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;}
  .mono{font-family:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:inherit;}

  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:16px 18px 10px;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;}
  .brand-mark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
  .brand-mark svg{width:15px;height:15px;}
  .brand h1{font-size:19px;font-weight:800;letter-spacing:-0.02em;margin:0;}
  .brand .tag{font-size:11.5px;color:var(--text-muted);font-weight:600;letter-spacing:.02em;}
  .add-home-btn{
    margin-left:auto;display:none;align-items:center;gap:4px;flex:none;
    border:1px solid var(--border);background:var(--surface-2);color:var(--text);
    font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;cursor:pointer;
  }
  .add-home-btn.show{display:flex;}
  .add-home-btn svg{width:12px;height:12px;}
  .home-tip{
    position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
    z-index:50;background:var(--surface);color:var(--text);border:1px solid var(--border);
    border-radius:12px;padding:12px 14px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-md);
    display:none;
  }
  .home-tip.show{display:block;}
  .home-tip button{margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}

  .locate-row{display:flex;gap:8px;}
  .locate-btn-main{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 16px;border-radius:12px;border:none;
    background:var(--accent);color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;
  }
  .locate-btn-main svg{width:17px;height:17px;}
  .locate-btn-main.loading svg{animation:spin 1s linear infinite;}
  .locate-btn-main.found{background:var(--ok);}
  @media (prefers-reduced-motion: reduce){ .locate-btn-main.loading svg{animation:none;} }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .loc-status{
    margin-top:8px;font-size:12px;font-weight:600;color:var(--text-muted);
    text-align:center;min-height:16px;
  }

  .search-box{position:relative;margin-top:10px;}
  .search-box svg{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--text-muted);pointer-events:none;
  }
  .search-box input{
    width:100%;padding:11px 12px 11px 36px;border-radius:11px;
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    font-size:14px;font-weight:600;outline:none;
  }
  .search-box input::placeholder{color:var(--text-muted);font-weight:500;}
  .search-box input:focus{border-color:var(--accent);}

  .toolbar{display:flex;gap:8px;padding:12px 18px 0;flex-wrap:wrap;row-gap:8px;}
  .filter-btn{
    display:flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--surface);padding:7px 12px;border-radius:10px;
    font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;
  }
  .filter-btn svg{width:14px;height:14px;}
  .filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .country-tabs{display:flex;gap:6px;padding:12px 18px 0;}
  .country-tab{
    flex:1;text-align:center;padding:9px 6px;border-radius:10px;
    border:1px solid var(--border);background:var(--surface-2);
    font-size:13px;font-weight:700;cursor:pointer;
  }
  .country-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .result-meta{padding:12px 18px 4px;font-size:12.5px;color:var(--text-muted);font-weight:600;}

  main{flex:1;padding:6px 18px 32px;display:flex;flex-direction:column;gap:10px;}

  .lot-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:13px 14px;cursor:pointer;box-shadow:var(--shadow-sm);text-align:left;
  }
  .lot-card:active{transform:scale(.995);}
  .lot-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .lot-name{font-size:14.5px;font-weight:700;letter-spacing:-0.01em;}
  .lot-dist{flex:none;font-size:12px;font-weight:700;color:var(--text-muted);}
  .lot-addr{font-size:12px;color:var(--text-muted);margin-top:1px;}
  .lot-badges{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  .badge{font-size:10.5px;font-weight:700;padding:2.5px 7px;border-radius:6px;background:var(--surface-2);color:var(--text-muted);letter-spacing:.01em;}
  .badge.moto-yes{background:var(--ok-soft);color:var(--ok);}
  .badge.moto-no{background:var(--full-soft);color:var(--full);}
  .badge.moto-unknown{background:var(--warn-soft);color:var(--warn);}
  .lot-rates{margin-top:9px;font-size:12px;color:var(--text);}
  .lot-rates .rate-line{display:flex;gap:6px;margin-top:3px;}
  .lot-rates .rate-label{flex:none;font-weight:700;color:var(--text-muted);width:62px;}
  .lot-rates .rate-val{flex:1;}
  .lot-source{margin-top:8px;font-size:10.5px;color:var(--text-muted);font-style:italic;}

  .maps-link{
    display:inline-flex;align-items:center;gap:5px;margin-top:9px;
    font-size:11.5px;font-weight:700;color:var(--accent);text-decoration:none;
  }
  .maps-link svg{width:13px;height:13px;}

  .empty, .state-card{
    text-align:center;padding:36px 22px;color:var(--text-muted);font-size:13.5px;font-weight:600;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);line-height:1.5;
  }
  .state-card b{color:var(--text);}

  footer{text-align:center;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--text-muted);font-weight:600;}
</style>
</head>
<body>
<div class="app" id="app">

  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 20V6a2 2 0 0 1 2-2h5.5a4.5 4.5 0 0 1 0 9H10v7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>ParkPilot</h1>
      <span class="tag">· Motorcycle parking finder</span>
      <button class="add-home-btn" id="addHomeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        Add
      </button>
    </div>

    <div class="locate-row">
      <button class="locate-btn-main" id="locateBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2"/></svg>
        <span id="locateBtnLabel">Find parking near me</span>
      </button>
    </div>
    <div class="loc-status" id="locStatus"></div>

    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="Search by mall or area name…" autocomplete="off" />
    </div>
  </header>

  <div class="country-tabs" id="countryTabs">
    <div class="country-tab active" data-v="ALL">All</div>
    <div class="country-tab" data-v="SG">Singapore</div>
    <div class="country-tab" data-v="JB">Johor Bahru</div>
  </div>

  <div class="toolbar">
    <button class="filter-btn active" id="motoOnlyBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M12 17.5H9l-1.5-5H10l3 5h2.5L13 9h3l1 3.5"/></svg>
      Allows motorcycles
    </button>
  </div>

  <div class="result-meta" id="resultMeta">Showing all locations · turn on location for distance sorting</div>

  <main id="listView"></main>

  <footer>
    Manually compiled directory · not affiliated with any mall or LTA · verify on arrival<br>
    Built by shiftedtech
  </footer>
</div>

<div class="home-tip" id="homeTip">
  Tap the <b>Share</b> icon in Safari, then choose <b>“Add to Home Screen”</b>.
  <br>
  <button id="homeTipClose" type="button">Got it</button>
</div>

<script>
(function(){
  "use strict";

  var DATA = [];
  var userLoc = null; // {lat, lng}
  var state = {
    country: "ALL",
    motoOnly: true,
    query: ""
  };

  /* ---------------- Lightweight fuzzy search (no external AI/API — see note in chat) ----------------
     Scores a location against the query: exact/substring hits rank highest,
     then falls back to simple typo-tolerant character overlap so small
     misspellings ("orchad", "jem mal") still surface the right result. */
  function levenshtein(a, b){
    if(a === b) return 0;
    var al = a.length, bl = b.length;
    if(al === 0) return bl;
    if(bl === 0) return al;
    var prev = new Array(bl + 1);
    for(var j = 0; j <= bl; j++) prev[j] = j;
    for(var i = 1; i <= al; i++){
      var cur = [i];
      for(var k = 1; k <= bl; k++){
        var cost = a[i-1] === b[k-1] ? 0 : 1;
        cur[k] = Math.min(prev[k]+1, cur[k-1]+1, prev[k-1]+cost);
      }
      prev = cur;
    }
    return prev[bl];
  }
  function matchesQuery(c, q){
    if(!q) return true;
    var hay = (c.name + " " + c.area).toLowerCase();
    if(hay.indexOf(q) !== -1) return true;
    // typo tolerance: compare query against each word in the haystack
    var words = hay.split(/[\s,()/-]+/).filter(Boolean);
    for(var i = 0; i < words.length; i++){
      var w = words[i];
      var maxDist = q.length <= 4 ? 1 : q.length <= 7 ? 2 : 3;
      if(w.length >= q.length - maxDist && levenshtein(q, w.slice(0, q.length + maxDist)) <= maxDist) return true;
    }
    return false;
  }

  function haversineKm(lat1, lon1, lat2, lon2){
    var R = 6371;
    var dLat = (lat2-lat1) * Math.PI/180;
    var dLon = (lon2-lon1) * Math.PI/180;
    var a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function fmtDist(km){
    if(km === null || km === undefined) return null;
    return km < 1 ? Math.round(km*1000) + " m" : km.toFixed(1) + " km";
  }
  function mapsUrl(c){
    return "https://www.google.com/maps/search/?api=1&query=" + c.lat + "," + c.lng;
  }
  function motoBadgeClass(v){
    return v === "yes" ? "moto-yes" : v === "no" ? "moto-no" : "moto-unknown";
  }
  function motoBadgeLabel(v){
    return v === "yes" ? "Motorcycles OK" : v === "no" ? "No motorcycle parking" : "Motorcycle policy unconfirmed";
  }

  var listView = document.getElementById("listView");
  var resultMeta = document.getElementById("resultMeta");

  function applyFilters(){
    var out = DATA.filter(function(c){
      if(state.country !== "ALL" && c.country !== state.country) return false;
      if(state.motoOnly && c.motorcycleAllowed === "no") return false;
      if(!matchesQuery(c, state.query)) return false;
      return true;
    });
    out.forEach(function(c){
      c._distanceKm = userLoc ? haversineKm(userLoc.lat, userLoc.lng, c.lat, c.lng) : null;
    });
    if(userLoc){
      out.sort(function(a,b){ return (a._distanceKm||9999) - (b._distanceKm||9999); });
    } else {
      out.sort(function(a,b){ return a.name.localeCompare(b.name); });
    }
    return out;
  }

  function render(){
    var results = applyFilters();
    resultMeta.textContent = results.length + (results.length===1?" location":" locations") +
      (userLoc ? " · sorted by distance" : " · turn on location for distance sorting");

    listView.innerHTML = "";
    if(results.length === 0){
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "No locations match those filters. Try widening them.";
      listView.appendChild(e);
      return;
    }
    results.forEach(function(c){ listView.appendChild(carCard(c)); });
  }

  function carCard(c){
    var card = document.createElement("div");
    card.className = "lot-card";
    var dist = fmtDist(c._distanceKm);
    card.innerHTML =
      '<div class="lot-top">'+
        '<div class="lot-name">'+c.name+'</div>'+
        (dist ? '<div class="lot-dist">'+dist+'</div>' : '')+
      '</div>'+
      '<div class="lot-addr">'+c.area+', '+(c.country === "SG" ? "Singapore" : "Johor Bahru")+'</div>'+
      '<div class="lot-badges">'+
        '<span class="badge '+motoBadgeClass(c.motorcycleAllowed)+'">'+motoBadgeLabel(c.motorcycleAllowed)+'</span>'+
      '</div>'+
      '<div class="lot-rates">'+
        '<div class="rate-line"><span class="rate-label">Moto</span><span class="rate-val">'+(c.motorcycleRate||"Unconfirmed")+'</span></div>'+
        '<div class="rate-line"><span class="rate-label">Car</span><span class="rate-val">'+(c.carRate||"Unconfirmed")+'</span></div>'+
      '</div>'+
      '<div class="lot-source">Source: '+c.sourceNote+' · checked '+c.lastChecked+'</div>'+
      '<a class="maps-link" href="'+mapsUrl(c)+'" target="_blank" rel="noopener">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5.5-2V4L9 6m0 14l6-2m-6 2V6m6 12l5.5 2V6L15 4m0 14V4m0 0L9 6"/></svg>'+
        'Open in Maps</a>';
    card.addEventListener("click", function(e){
      if(e.target.closest(".maps-link")) return;
      window.open(mapsUrl(c), "_blank", "noopener");
    });
    return card;
  }

  /* ---------------- Country tabs ---------------- */
  var countryTabs = document.getElementById("countryTabs");
  Array.prototype.forEach.call(countryTabs.children, function(tab){
    tab.addEventListener("click", function(){
      Array.prototype.forEach.call(countryTabs.children, function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      state.country = tab.dataset.v;
      render();
    });
  });

  /* ---------------- Motorcycle-only filter ---------------- */
  var motoOnlyBtn = document.getElementById("motoOnlyBtn");
  motoOnlyBtn.addEventListener("click", function(){
    state.motoOnly = !state.motoOnly;
    motoOnlyBtn.classList.toggle("active", state.motoOnly);
    render();
  });

  /* ---------------- Geolocation ---------------- */
  var locateBtn = document.getElementById("locateBtn");
  var locateBtnLabel = document.getElementById("locateBtnLabel");
  var locStatus = document.getElementById("locStatus");

  function locateMe(){
    if(!("geolocation" in navigator)){
      locStatus.textContent = "This browser doesn't support location.";
      return;
    }
    locateBtn.classList.add("loading");
    locateBtnLabel.textContent = "Finding you…";
    navigator.geolocation.getCurrentPosition(
      function(pos){
        locateBtn.classList.remove("loading");
        locateBtn.classList.add("found");
        var lat = pos.coords.latitude, lng = pos.coords.longitude;
        userLoc = {lat: lat, lng: lng};
        // rough SG/JB bounding box check, just to set a helpful status message
        var inRegion = (lat > 1.1 && lat < 2.1 && lng > 103.2 && lng < 104.3);
        locateBtnLabel.textContent = "Location found";
        locStatus.textContent = inRegion
          ? "Showing nearest locations first."
          : "You're outside the SG/JB area covered by this directory — showing all locations, distance may not be meaningful.";
        render();
      },
      function(err){
        locateBtn.classList.remove("loading");
        locateBtnLabel.textContent = "Find parking near me";
        var msg = "Couldn't get your location.";
        if(err && err.code === err.PERMISSION_DENIED) msg = "Location permission denied — you can still browse the full list below.";
        else if(err && err.code === err.TIMEOUT) msg = "Location request timed out — try again.";
        locStatus.textContent = msg;
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  }
  locateBtn.addEventListener("click", locateMe);

  /* ---------------- Search ---------------- */
  var searchInput = document.getElementById("searchInput");
  var searchDebounce = null;
  searchInput.addEventListener("input", function(){
    clearTimeout(searchDebounce);
    var v = searchInput.value;
    searchDebounce = setTimeout(function(){
      state.query = v.trim().toLowerCase();
      render();
    }, 120);
  });

  /* ---------------- Add to Home Screen ---------------- */
  var addHomeBtn = document.getElementById("addHomeBtn");
  var homeTip = document.getElementById("homeTip");
  var homeTipClose = document.getElementById("homeTipClose");
  var deferredInstallPrompt = null;

  function isStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }
  function isIOS(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  if(!isStandalone()){
    if(isIOS()){
      // No install-prompt API on iOS Safari; show button that opens instructions.
      addHomeBtn.classList.add("show");
      addHomeBtn.addEventListener("click", function(){
        homeTip.classList.add("show");
      });
      homeTipClose.addEventListener("click", function(){
        homeTip.classList.remove("show");
      });
    } else {
      window.addEventListener("beforeinstallprompt", function(e){
        e.preventDefault();
        deferredInstallPrompt = e;
        addHomeBtn.classList.add("show");
      });
      addHomeBtn.addEventListener("click", function(){
        if(!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.finally(function(){
          deferredInstallPrompt = null;
          addHomeBtn.classList.remove("show");
        });
      });
      window.addEventListener("appinstalled", function(){
        addHomeBtn.classList.remove("show");
      });
    }
  }

  /* ---------------- Boot ---------------- */
  function boot(){
    fetch("./data/carparks.json")
      .then(function(res){
        if(!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function(json){
        DATA = Array.isArray(json) ? json : [];
        render();
      })
      .catch(function(err){
        listView.innerHTML = "";
        var card = document.createElement("div");
        card.className = "state-card";
        card.innerHTML = "<b>Couldn't load the carpark directory.</b><br>" + err.message;
        listView.appendChild(card);
      });
  }

  boot();
})();
</script>
</body>
</html>
